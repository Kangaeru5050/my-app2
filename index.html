<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Minecraft MVP in Browser</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #78a7ff;
      font-family: 'Minecraft', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* クロスヘア */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
    }
    #crosshair::before {
      top: 9px;
      left: 0;
      width: 20px;
      height: 2px;
    }
    #crosshair::after {
      top: 0;
      left: 9px;
      width: 2px;
      height: 20px;
    }

    /* 開始・一時停止オーバーレイ */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      z-index: 100;
      cursor: pointer;
    }
    #overlay h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0px #222, 0 0 10px rgba(0,0,0,0.5);
      color: #6cf56c;
      letter-spacing: 2px;
    }
    #overlay .btn-start {
      background: #4CAF50;
      border: 3px solid #2E7D32;
      box-shadow: 0 6px 0 #1B5E20;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 14px 40px;
      margin-top: 20px;
      border-radius: 6px;
      transition: all 0.1s ease;
      cursor: pointer;
    }
    #overlay .btn-start:hover {
      background: #45a049;
      transform: translateY(-2px);
    }
    #overlay .instructions {
      margin-top: 30px;
      background: rgba(0, 0, 0, 0.4);
      padding: 20px 30px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      line-height: 1.8;
      font-size: 1.1rem;
      text-align: center;
    }
    .key-badge {
      display: inline-block;
      background: #333;
      border: 1px solid #777;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: monospace;
      font-size: 0.9em;
      margin: 0 3px;
      box-shadow: 0 2px 0 #111;
    }

    /* ホットバー（スロット） */
    #hotbar-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      border-radius: 8px;
      border: 2px solid #555;
      z-index: 10;
    }
    .hotbar-slot {
      width: 52px;
      height: 52px;
      background: rgba(60, 60, 60, 0.8);
      border: 2px solid #333;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    .hotbar-slot.active {
      border: 3px solid #ffff55;
      background: rgba(100, 100, 100, 0.85);
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255, 255, 85, 0.7);
    }
    .slot-key {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 11px;
      color: #aaa;
      font-weight: bold;
    }
    .slot-icon {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
    }

    /* UI ステータス表示（座標・FPS） */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      font-size: 14px;
      font-family: monospace;
      text-shadow: 1px 1px 2px #000;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 6px;
      z-index: 10;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- PointerLockControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <!-- HUD -->
  <div id="hud">
    <div><strong>3D MINECRAFT MVP</strong></div>
    <div id="fps-display">FPS: 60</div>
    <div id="pos-display">XYZ: 0 / 0 / 0</div>
    <div id="block-count">Blocks: 0</div>
  </div>

  <!-- ホットバー -->
  <div id="hotbar-container">
    <!-- JSで自動生成 -->
  </div>

  <!-- 開始/一時停止画面 -->
  <div id="overlay">
    <h1>MINECRAFT MVP</h1>
    <p>ブラウザで動く3Dボクセルワールド</p>
    <button class="btn-start">クリックしてプレイ開始</button>
    <div class="instructions">
      <p><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> : 移動</p>
      <p><span class="key-badge">SPACE</span> : ジャンプ &nbsp;|&nbsp; <span class="key-badge">SHIFT</span> : 下降 / しゃがみ</p>
      <p><span class="key-badge">マウス左クリック</span> : ブロック破壊</p>
      <p><span class="key-badge">マウス右クリック</span> : ブロック設置</p>
      <p><span class="key-badge">1</span> 〜 <span class="key-badge">9</span> / <span class="key-badge">ホイール</span> : ブロック切り替え</p>
      <p><span class="key-badge">ESC</span> : マウスポインタ解放 / 一時停止</p>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. 音声エンジン (Web Audio API)
       ========================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
      }
      playBreak() {
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(30, t + 0.12);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.12);
        } catch(e) {}
      }
      playPlace() {
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.exponentialRampToValueAtTime(110, t + 0.08);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        } catch(e) {}
      }
      playJump() {
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(300, t + 0.15);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        } catch(e) {}
      }
    }
    const sound = new SoundEngine();

    /* ==========================================================
       2. プロシージャル テクスチャ生成 (16x16 Pixel Art)
       ========================================================== */
    function createPixelTexture(drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      drawFn(ctx);
      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return { texture, canvas };
    }

    function randNoise(ctx, baseColor, noiseColors) {
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 16, 16);
      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          if (Math.random() > 0.4) {
            ctx.fillStyle = noiseColors[Math.floor(Math.random() * noiseColors.length)];
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    }

    // 各種テクスチャ
    // 草上面
    const grassTop = createPixelTexture(ctx => {
      randNoise(ctx, '#5c9632', ['#4e822a', '#6aa938', '#548c2e']);
    });
    // 土
    const dirtTex = createPixelTexture(ctx => {
      randNoise(ctx, '#866043', ['#725137', '#9c7352', '#5e432c']);
    });
    // 草側面
    const grassSide = createPixelTexture(ctx => {
      randNoise(ctx, '#866043', ['#725137', '#9c7352', '#5e432c']);
      // 上部の芝生
      for (let x = 0; x < 16; x++) {
        const h = 2 + Math.floor(Math.random() * 3);
        ctx.fillStyle = '#5c9632';
        ctx.fillRect(x, 0, 1, h);
        ctx.fillStyle = '#4e822a';
        ctx.fillRect(x, h, 1, 1);
      }
    });
    // 石
    const stoneTex = createPixelTexture(ctx => {
      randNoise(ctx, '#7b7b7b', ['#666666', '#8a8a8a', '#545454']);
    });
    // 丸石
    const cobbleTex = createPixelTexture(ctx => {
      randNoise(ctx, '#686868', ['#4c4c4c', '#8a8a8a', '#3f3f3f', '#969696']);
      // ひび割れ風グリッド
      ctx.fillStyle = '#333333';
      for (let i = 0; i < 16; i += 4) {
        ctx.fillRect(i, 0, 1, 16);
        ctx.fillRect(0, i, 16, 1);
      }
    });
    // 木の幹（側面）
    const woodSide = createPixelTexture(ctx => {
      ctx.fillStyle = '#675232';
      ctx.fillRect(0, 0, 16, 16);
      for (let x = 0; x < 16; x++) {
        const col = (x % 3 === 0) ? '#4e3d24' : ((x % 3 === 1) ? '#79613c' : '#675232');
        ctx.fillStyle = col;
        ctx.fillRect(x, 0, 1, 16);
        // ランダムノイズ
        for (let y = 0; y < 16; y++) {
          if (Math.random() > 0.6) {
            ctx.fillStyle = '#3f311c';
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    });
    // 木の幹（上面）
    const woodTop = createPixelTexture(ctx => {
      randNoise(ctx, '#9e7f53', ['#8d6f46', '#b08e5e']);
      ctx.strokeStyle = '#5a4529';
      ctx.lineWidth = 1;
      ctx.strokeRect(3, 3, 10, 10);
      ctx.strokeRect(6, 6, 4, 4);
    });
    // 葉
    const leafTex = createPixelTexture(ctx => {
      randNoise(ctx, '#366d21', ['#2a5719', '#46892c', '#1e4011', '#519c34']);
    });
    // 木材 (Planks)
    const plankTex = createPixelTexture(ctx => {
      randNoise(ctx, '#b8945f', ['#a58250', '#c8a46e']);
      ctx.fillStyle = '#6e542e';
      for (let y = 3; y < 16; y += 4) {
        ctx.fillRect(0, y, 16, 1);
      }
    });
    // レンガ (Bricks)
    const brickTex = createPixelTexture(ctx => {
      ctx.fillStyle = '#9c4939';
      ctx.fillRect(0, 0, 16, 16);
      ctx.fillStyle = '#d5c4b1';
      // モルタル目地
      for (let y = 0; y < 16; y += 4) {
        ctx.fillRect(0, y, 16, 1);
      }
      ctx.fillRect(4, 0, 1, 4);
      ctx.fillRect(12, 0, 1, 4);
      ctx.fillRect(8, 4, 1, 4);
      ctx.fillRect(0, 4, 1, 4);
      ctx.fillRect(4, 8, 1, 4);
      ctx.fillRect(12, 8, 1, 4);
      ctx.fillRect(8, 12, 1, 4);
      ctx.fillRect(0, 12, 1, 4);
    });
    // ガラス
    const glassTex = createPixelTexture(ctx => {
      ctx.clearRect(0, 0, 16, 16);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.strokeRect(0.5, 0.5, 15, 15);
      // 光の筋
      ctx.fillRect(2, 2, 2, 2);
      ctx.fillRect(5, 5, 2, 2);
      ctx.fillRect(8, 8, 2, 2);
    });

    /* ==========================================================
       3. ブロック定義
       ========================================================== */
    const BLOCKS = {
      1: {
        name: '草ブロック',
        materials: [
          new THREE.MeshLambertMaterial({ map: grassSide.texture }), // 右
          new THREE.MeshLambertMaterial({ map: grassSide.texture }), // 左
          new THREE.MeshLambertMaterial({ map: grassTop.texture }),  // 上
          new THREE.MeshLambertMaterial({ map: dirtTex.texture }),   // 下
          new THREE.MeshLambertMaterial({ map: grassSide.texture }), // 前
          new THREE.MeshLambertMaterial({ map: grassSide.texture }), // 後
        ],
        icon: grassSide.canvas.toDataURL()
      },
      2: {
        name: '土',
        materials: new THREE.MeshLambertMaterial({ map: dirtTex.texture }),
        icon: dirtTex.canvas.toDataURL()
      },
      3: {
        name: '石',
        materials: new THREE.MeshLambertMaterial({ map: stoneTex.texture }),
        icon: stoneTex.canvas.toDataURL()
      },
      4: {
        name: '丸石',
        materials: new THREE.MeshLambertMaterial({ map: cobbleTex.texture }),
        icon: cobbleTex.canvas.toDataURL()
      },
      5: {
        name: '原木',
        materials: [
          new THREE.MeshLambertMaterial({ map: woodSide.texture }),
          new THREE.MeshLambertMaterial({ map: woodSide.texture }),
          new THREE.MeshLambertMaterial({ map: woodTop.texture }),
          new THREE.MeshLambertMaterial({ map: woodTop.texture }),
          new THREE.MeshLambertMaterial({ map: woodSide.texture }),
          new THREE.MeshLambertMaterial({ map: woodSide.texture }),
        ],
        icon: woodSide.canvas.toDataURL()
      },
      6: {
        name: '木の葉',
        materials: new THREE.MeshLambertMaterial({ map: leafTex.texture, transparent: true, opacity: 0.92 }),
        icon: leafTex.canvas.toDataURL()
      },
      7: {
        name: '木材',
        materials: new THREE.MeshLambertMaterial({ map: plankTex.texture }),
        icon: plankTex.canvas.toDataURL()
      },
      8: {
        name: 'レンガ',
        materials: new THREE.MeshLambertMaterial({ map: brickTex.texture }),
        icon: brickTex.canvas.toDataURL()
      },
      9: {
        name: 'ガラス',
        materials: new THREE.MeshLambertMaterial({ map: glassTex.texture, transparent: true, opacity: 0.65 }),
        icon: glassTex.canvas.toDataURL()
      }
    };

    let selectedBlockType = 1;

    /* ==========================================================
       4. ホットバー UI構築
       ========================================================== */
    const hotbarContainer = document.getElementById('hotbar-container');
    for (let i = 1; i <= 9; i++) {
      const slot = document.createElement('div');
      slot.className = `hotbar-slot ${i === 1 ? 'active' : ''}`;
      slot.dataset.id = i;
      slot.innerHTML = `
        <span class="slot-key">${i}</span>
        <img class="slot-icon" src="${BLOCKS[i].icon}" alt="${BLOCKS[i].name}">
      `;
      slot.addEventListener('click', () => selectSlot(i));
      hotbarContainer.appendChild(slot);
    }

    function selectSlot(num) {
      if (num < 1 || num > 9) return;
      selectedBlockType = num;
      document.querySelectorAll('.hotbar-slot').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.id) === num);
      });
      updateHandBlock();
    }

    /* ==========================================================
       5. Three.js シーン初期化
       ========================================================== */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8bc0ff);
    scene.fog = new THREE.FogExp2(0x8bc0ff, 0.022);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff8e7, 0.85);
    sunLight.position.set(50, 80, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 200;
    const d = 40;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // 雲
    function createClouds() {
      const cloudGeo = new THREE.BoxGeometry(22, 2, 16);
      const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
      const cloudGroup = new THREE.Group();
      for (let i = 0; i < 15; i++) {
        const cloud = new THREE.Mesh(cloudGeo, cloudMat);
        cloud.position.set(
          (Math.random() - 0.5) * 200,
          32 + Math.random() * 4,
          (Math.random() - 0.5) * 200
        );
        cloudGroup.add(cloud);
      }
      scene.add(cloudGroup);
      return cloudGroup;
    }
    const clouds = createClouds();

    // ターゲット枠線
    const highlightBox = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(1.005, 1.005, 1.005)),
      new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
    );
    highlightBox.visible = false;
    scene.add(highlightBox);

    /* ==========================================================
       6. 手元のブロック表示 (Hand Item)
       ========================================================== */
    const handGroup = new THREE.Group();
    camera.add(handGroup);
    scene.add(camera);

    const handGeometry = new THREE.BoxGeometry(0.35, 0.35, 0.35);
    let handMesh = new THREE.Mesh(handGeometry, BLOCKS[selectedBlockType].materials);
    handMesh.position.set(0.42, -0.38, -0.65);
    handMesh.rotation.set(0.3, -0.5, 0.2);
    handGroup.add(handMesh);

    function updateHandBlock() {
      handMesh.material = BLOCKS[selectedBlockType].materials;
    }

    let swingProgress = 0;
    let isSwinging = false;
    function swingHand() {
      if (isSwinging) return;
      isSwinging = true;
      swingProgress = 0;
    }

    /* ==========================================================
       7. ボクセルワールド管理
       ========================================================== */
    const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
    const worldMap = new Map(); // key: "x,y,z" -> { mesh, type }
    const blockMeshes = []; // Raycast用配列

    function blockKey(x, y, z) {
      return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
    }

    function addBlock(x, y, z, type, triggerSound = false) {
      x = Math.round(x);
      y = Math.round(y);
      z = Math.round(z);
      const key = blockKey(x, y, z);
      if (worldMap.has(key)) return null;

      const blockInfo = BLOCKS[type];
      const mesh = new THREE.Mesh(blockGeometry, blockInfo.materials);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { x, y, z, type };

      scene.add(mesh);
      worldMap.set(key, { mesh, type });
      blockMeshes.push(mesh);

      if (triggerSound) sound.playPlace();
      updateBlockCountHUD();
      return mesh;
    }

    function removeBlock(x, y, z, triggerSound = true) {
      x = Math.round(x);
      y = Math.round(y);
      z = Math.round(z);
      const key = blockKey(x, y, z);
      if (!worldMap.has(key)) return;

      const data = worldMap.get(key);
      scene.remove(data.mesh);
      const index = blockMeshes.indexOf(data.mesh);
      if (index !== -1) blockMeshes.splice(index, 1);
      worldMap.delete(key);

      // 破壊パーティクル
      createBreakParticles(x, y, z, data.type);

      if (triggerSound) sound.playBreak();
      updateBlockCountHUD();
    }

    function hasBlock(x, y, z) {
      return worldMap.has(blockKey(x, y, z));
    }

    function updateBlockCountHUD() {
      document.getElementById('block-count').textContent = `Blocks: ${worldMap.size}`;
    }

    /* 破壊パーティクル */
    const particles = [];
    const pGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
    function createBreakParticles(x, y, z, type) {
      const mat = Array.isArray(BLOCKS[type].materials) ? BLOCKS[type].materials[0] : BLOCKS[type].materials;
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(pGeo, mat);
        p.position.set(
          x + (Math.random() - 0.5) * 0.7,
          y + (Math.random() - 0.5) * 0.7,
          z + (Math.random() - 0.5) * 0.7
        );
        p.userData = {
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 4,
            Math.random() * 4 + 1,
            (Math.random() - 0.5) * 4
          ),
          life: 0.5
        };
        scene.add(p);
        particles.push(p);
      }
    }

    /* ワールド生成 (丘陵地形 & 木) */
    function generateWorld() {
      const WORLD_SIZE = 26; // -13 ~ 13
      const half = Math.floor(WORLD_SIZE / 2);

      for (let x = -half; x <= half; x++) {
        for (let z = -half; z <= half; z++) {
          // 複数の波の組み合わせで起伏を作る
          const s1 = Math.sin(x * 0.18) * Math.cos(z * 0.18) * 3;
          const s2 = Math.sin(x * 0.08 + z * 0.08) * 2;
          const height = Math.max(1, Math.floor(s1 + s2 + 4));

          for (let y = 0; y <= height; y++) {
            if (y === height) {
              addBlock(x, y, z, 1); // 草
            } else if (y >= height - 2) {
              addBlock(x, y, z, 2); // 土
            } else {
              addBlock(x, y, z, 3); // 石
            }
          }

          // ランダムに木を生成（周囲と少し間隔をあける）
          if (x % 6 === 0 && z % 6 === 0 && Math.random() > 0.35 && height >= 2) {
            generateTree(x, height + 1, z);
          }
        }
      }
      updateBlockCountHUD();
    }

    function generateTree(baseX, baseY, baseZ) {
      const trunkHeight = 4 + Math.floor(Math.random() * 2);
      // 幹
      for (let y = 0; y < trunkHeight; y++) {
        addBlock(baseX, baseY + y, baseZ, 5); // 原木
      }
      // 葉
      const leafBase = baseY + trunkHeight - 1;
      for (let lx = -2; lx <= 2; lx++) {
        for (let lz = -2; lz <= 2; lz++) {
          for (let ly = 0; ly <= 2; ly++) {
            if (Math.abs(lx) === 2 && Math.abs(lz) === 2 && (ly === 2 || Math.random() > 0.4)) continue;
            if (lx === 0 && lz === 0 && ly < trunkHeight - 2) continue; // 幹の位置
            addBlock(baseX + lx, leafBase + ly, baseZ + lz, 6);
          }
        }
      }
    }

    generateWorld();

    /* ==========================================================
       8. コントロール & プレイヤー物理演算
       ========================================================== */
    const controls = new THREE.PointerLockControls(camera, document.body);
    const overlay = document.getElementById('overlay');

    overlay.addEventListener('click', () => {
      sound.init();
      controls.lock();
    });

    controls.addEventListener('lock', () => {
      overlay.style.display = 'none';
    });
    controls.addEventListener('unlock', () => {
      overlay.style.display = 'flex';
    });

    // キー入力監視
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.key >= '1' && e.key <= '9') {
        selectSlot(parseInt(e.key));
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // マウスホイールでブロック選択切り替え
    window.addEventListener('wheel', (e) => {
      if (!controls.isLocked) return;
      let next = selectedBlockType + (e.deltaY > 0 ? 1 : -1);
      if (next > 9) next = 1;
      if (next < 1) next = 9;
      selectSlot(next);
    });

    // プレイヤー状態
    const player = {
      pos: new THREE.Vector3(0, 16, 0),
      vel: new THREE.Vector3(0, 0, 0),
      radius: 0.35,
      height: 1.75,
      eyeHeight: 1.6,
      onGround: false,
      speed: 8.0,
      jumpSpeed: 9.0
    };
    camera.position.copy(player.pos);

    // AABB簡易衝突判定
    function checkCollision(pos) {
      const minX = Math.floor(pos.x - player.radius);
      const maxX = Math.floor(pos.x + player.radius);
      const minY = Math.floor(pos.y);
      const maxY = Math.floor(pos.y + player.height);
      const minZ = Math.floor(pos.z - player.radius);
      const maxZ = Math.floor(pos.z + player.radius);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (hasBlock(x, y, z)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // マウス左クリック・右クリック
    const raycaster = new THREE.Raycaster();
    const centerScreen = new THREE.Vector2(0, 0);

    window.addEventListener('mousedown', (e) => {
      if (!controls.isLocked) return;
      swingHand();

      raycaster.setFromCamera(centerScreen, camera);
      const intersects = raycaster.intersectObjects(blockMeshes, false);

      if (intersects.length > 0 && intersects[0].distance < 6.0) {
        const hit = intersects[0];
        const blockPos = hit.object.position;

        if (e.button === 0) {
          // 左クリック: ブロック破壊
          removeBlock(blockPos.x, blockPos.y, blockPos.z);
        } else if (e.button === 2) {
          // 右クリック: ブロック設置
          const placePos = new THREE.Vector3().copy(blockPos).add(hit.face.normal);
          
          // プレイヤーの体と重なっていないか確認
          const pBox = new THREE.Box3(
            new THREE.Vector3(player.pos.x - player.radius, player.pos.y, player.pos.z - player.radius),
            new THREE.Vector3(player.pos.x + player.radius, player.pos.y + player.height, player.pos.z + player.radius)
          );
          const bBox = new THREE.Box3(
            new THREE.Vector3(placePos.x - 0.5, placePos.y - 0.5, placePos.z - 0.5),
            new THREE.Vector3(placePos.x + 0.5, placePos.y + 0.5, placePos.z + 0.5)
          );

          if (!pBox.intersectsBox(bBox)) {
            addBlock(placePos.x, placePos.y, placePos.z, selectedBlockType, true);
          }
        }
      }
    });

    // 右クリックメニュー防止
    window.addEventListener('contextmenu', e => e.preventDefault());

    /* ==========================================================
       9. メインループ & アニメーション
       ========================================================== */
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();
    let walkBobTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // FPS更新
      frameCount++;
      if (now - lastFpsUpdate > 500) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
        document.getElementById('fps-display').textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastFpsUpdate = now;
      }

      if (controls.isLocked) {
        // 水平移動入力の算出
        const moveDir = new THREE.Vector3();
        if (keys['KeyW']) moveDir.z -= 1;
        if (keys['KeyS']) moveDir.z += 1;
        if (keys['KeyA']) moveDir.x -= 1;
        if (keys['KeyD']) moveDir.x += 1;
        moveDir.normalize();

        const camDirection = new THREE.Vector3();
        camera.getWorldDirection(camDirection);
        const forward = new THREE.Vector3(camDirection.x, 0, camDirection.z).normalize();
        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        const inputVelocity = new THREE.Vector3();
        inputVelocity.addScaledVector(forward, -moveDir.z * player.speed);
        inputVelocity.addScaledVector(right, -moveDir.x * player.speed);

        // 重力とジャンプ
        if (keys['Space'] && player.onGround) {
          player.vel.y = player.jumpSpeed;
          player.onGround = false;
          sound.playJump();
        }

        player.vel.y -= 26.0 * dt; // 重力加速度

        // 移動と各軸ごとの衝突判定
        const targetPos = player.pos.clone();

        // X軸移動
        targetPos.x += inputVelocity.x * dt;
        if (!checkCollision(new THREE.Vector3(targetPos.x, player.pos.y, player.pos.z))) {
          player.pos.x = targetPos.x;
        } else {
          targetPos.x = player.pos.x;
        }

        // Z軸移動
        targetPos.z += inputVelocity.z * dt;
        if (!checkCollision(new THREE.Vector3(player.pos.x, player.pos.y, targetPos.z))) {
          player.pos.z = targetPos.z;
        } else {
          targetPos.z = player.pos.z;
        }

        // Y軸移動
        player.onGround = false;
        targetPos.y += player.vel.y * dt;
        if (!checkCollision(new THREE.Vector3(player.pos.x, targetPos.y, player.pos.z))) {
          player.pos.y = targetPos.y;
        } else {
          if (player.vel.y < 0) {
            player.onGround = true;
            player.pos.y = Math.ceil(targetPos.y);
          }
          player.vel.y = 0;
        }

        // 奈落落下時のリスポーン
        if (player.pos.y < -15) {
          player.pos.set(0, 18, 0);
          player.vel.set(0, 0, 0);
        }

        // カメラ位置更新
        camera.position.set(player.pos.x, player.pos.y + player.eyeHeight, player.pos.z);

        // HUD座標表示
        document.getElementById('pos-display').textContent = 
          `XYZ: ${player.pos.x.toFixed(1)} / ${player.pos.y.toFixed(1)} / ${player.pos.z.toFixed(1)}`;

        // 歩行ボビング
        const isMoving = moveDir.lengthSq() > 0 && player.onGround;
        if (isMoving) {
          walkBobTimer += dt * 10;
        } else {
          walkBobTimer = 0;
        }
        const bobOffset = Math.sin(walkBobTimer) * 0.03;

        // 手元のブロックアニメーション
        if (isSwinging) {
          swingProgress += dt * 8;
          if (swingProgress >= Math.PI) {
            swingProgress = 0;
            isSwinging = false;
          }
        }
        const swingOffset = Math.sin(swingProgress) * 0.4;
        handMesh.position.set(0.42, -0.38 + bobOffset - swingOffset * 0.2, -0.65 - swingOffset * 0.3);
        handMesh.rotation.set(0.3 + swingOffset, -0.5 - swingOffset * 0.5, 0.2 - swingOffset);

        // レイキャストによる照準先のハイライト
        raycaster.setFromCamera(centerScreen, camera);
        const intersects = raycaster.intersectObjects(blockMeshes, false);
        if (intersects.length > 0 && intersects[0].distance < 6.0) {
          const hit = intersects[0];
          highlightBox.position.copy(hit.object.position);
          highlightBox.visible = true;
        } else {
          highlightBox.visible = false;
        }
      }

      // 雲のゆっくりした移動
      clouds.children.forEach(c => {
        c.position.x += dt * 1.5;
        if (c.position.x > 100) c.position.x = -100;
      });

      // パーティクル更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.userData.vel.y -= 14.0 * dt;
        p.position.addScaledVector(p.userData.vel, dt);
        p.userData.life -= dt;
        p.scale.setScalar(Math.max(0.01, p.userData.life / 0.5));
        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // ウィンドウリサイズ対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
